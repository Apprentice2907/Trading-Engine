name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        build_type: [Debug, Release]
        include:
          - os: windows-latest
            cmake_generator: "Visual Studio 17 2022"
            cmake_arch: "-A x64"
          - os: ubuntu-latest
            cmake_generator: "Ninja"
            cmake_arch: ""
            apt_packages: "ninja-build build-essential"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Linux: install build tools
      # -----------------------------------------------------------------------
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ${{ matrix.apt_packages }}

      # -----------------------------------------------------------------------
      # CMake configure
      # -----------------------------------------------------------------------
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build ^
            -G "${{ matrix.cmake_generator }}" ${{ matrix.cmake_arch }} ^
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        shell: cmd

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build \
            -G "${{ matrix.cmake_generator }}" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      # -----------------------------------------------------------------------
      # Build
      # -----------------------------------------------------------------------
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 4
        shell: cmd

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 4

      # -----------------------------------------------------------------------
      # Run tests via CTest
      # -----------------------------------------------------------------------
      - name: Test (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        run: ctest -C ${{ matrix.build_type }} --output-on-failure
        shell: cmd

      - name: Test (Linux)
        if: runner.os == 'Linux'
        working-directory: build
        run: ctest -C ${{ matrix.build_type }} --output-on-failure
